# Decap CMS settings (editor at https://www.seaseas.nl/admin/)
# 1. Replace OWNER below with the GitHub account or organisation that holds the repository.
# 2. Login runs via GitHub. On Netlify: Site configuration > Access & security > OAuth > install GitHub provider.
#    On GitHub Pages a small OAuth helper is needed instead (see README).
backend:
  name: github
  repo: peterboers-seaseas/public_website
  branch: main
  base_url: https://api.netlify.com

site_url: https://www.seaseas.nl
display_url: https://www.seaseas.nl
logo_url: /images/logo.png
locale: en

media_folder: public/images/news
public_folder: /images/news

collections:
  - name: news
    label: News and publications
    label_singular: News article
    folder: src/content/news
    create: true
    slug: "{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date (used for ordering), name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: "Published (text, e.g. '30 July 2026 at 18:26')", name: published, widget: string, required: false }
      - { label: "Type (e.g. Press release, Publication)", name: type, widget: string, default: Press release }
      - { label: Summary (English, 1-2 sentences), name: excerpt, widget: text }
      - { label: Summary (Dutch, optional), name: excerpt_nl, widget: text, required: false }
      - label: Image
        name: media
        widget: object
        fields:
          - { label: Background photo (16:9), name: photo, widget: image, required: false }
          - { label: "Photo focus (e.g. '20% 40%')", name: position, widget: string, default: "50% 50%" }
          - { label: Partner logo (transparent PNG), name: logo, widget: image, required: false }
          - { label: Logo description, name: logoAlt, widget: string, required: false }
          - { label: Logo width (% of the image), name: logoWidth, widget: number, value_type: int, default: 44 }
      - { label: Key points (optional), name: bullets, widget: list, required: false }
      - { label: "Hide from site (draft)", name: draft, widget: boolean, default: false }
      - { label: Article text, name: body, widget: markdown }

  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    create: true
    slug: "{{slug}}"
    identifier_field: name
    media_folder: /public/images/team
    public_folder: /images/team
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role (English), name: role_en, widget: string }
      - { label: Role (Dutch), name: role_nl, widget: string }
      - { label: Portrait (square), name: photo, widget: image, required: false }
      - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
      - { label: Order in slider (1 = first), name: order, widget: number, value_type: int, default: 9 }
